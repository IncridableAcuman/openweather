services:
  # 1. Spring Boot Backend Web Service
  - type: web
    name: openweather-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: frankfurt
    healthCheckPath: /api/v1/weather?city=Tashkent
    envVars:
      - key: PORT
        value: 8080
      - key: API_KEY
        value: caa78e410727423502f6d7225aced2b4
      - key: API_URL
        value: https://api.openweathermap.org/data/2.5/weather
      - key: API_FORECAST_URL
        value: https://api.openweathermap.org/data/2.5/forecast

  # 2. React / Vite Frontend Static Site
  - type: web
    name: openweather-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
